name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same entry point as on the Mac: venv + editable install + pytest.
      # CPU only: no Roblox Studio, no API keys, no paid calls.
      - name: CPU tests
        run: make test
        env:
          PYTHON: python
