# M2 on the harder F1 rooms (WS-14, ADR 0013, ADR 0014). Declared and committed on 11 Nov 2026
# BEFORE any run of it. NOT RUN: no part has an experiment folder, a lock or a result. Each part is
# one experiment (run with --part <experiment>); the runner locks a part's folder to the SHA-256
# of THIS file when that part's first episode bundle is written, so after any part starts, a change
# to any field here is a NEW suite id, never an edit. (Edited once, on 11 Nov 2026, before any run:
# the owner's decisions below; nothing had run, so no folder or lock existed.)
#
# Scenes: F1-A at the M1 stage (reference) plus every WS-14 fixture that passed the offline
# hardness test (bundles/hardness/summary.json: F1-B 4/200, F1-C 0/200, F1-D 0/200; all passed).
# Live gate (ADR 0013) PASSED on 11 Nov 2026 for all three fixtures, in places/worldsmith-lab.rbxl,
# p0.v3, N 3, read-back 0 differences (bundles/experiments/gate_f1b, gate_f1b_fix, gate_f1c,
# gate_f1c_fix, gate_f1d, gate_f1d_fix: each B0/ep0/summary.json; docs/HANDOFF.md "WS-14 live
# gate"): F1-B FELL 3/3 in the gap_1 area, F1-C and F1-D STUCK 3/3 with no LEVER_ACTIVATED, each
# fix.json SUCCESS 3/3. F1-A's gate is M0's.
#
# Every common field is m2_f1a_b3.yaml's (player p0.v3, route, timing, N, k, max_revisions, caps,
# preflight, classifier, ladder, baseline prompt) except:
#   stage: M1 (set bridge_1.length/width/lateral_offset, move lever_1/gate_1, add Wall/Decor; ADR 0007)
#   architect.prompt_bytes_cap: 32000 (was 24000; owner, 11 Nov 2026). M1 requests are larger: a
#     pessimistic third revision on F1-D bounds to more than 24000 (tests/test_ws14_m2_hard.py), and
#     a request over the cap is refused unsent, which stops the run.
#   dry_run.fixtures: the WS-14 M1 replies (architect/fixtures/m1/), so --dry-run rehearses every
#     condition of every part (B3 included); m2_f1a_b3's are F1-A M0 replies.
#
# Episodes per part (owner, 11 Nov 2026): B0 1 and B1 1; B2, B3-haiku, B3-sonnet, B3-opus 3 each.
# B0 and B1 rooms are deterministic (the original scene and one fixed hand patch, no proposer
# choice), the live gate already ran each broken scene and each hand-fixed room 3/3 (above), and one
# episode each saves Studio time. Worst case (ADR 0010 s6 method: per call, the jzapi worst case of
# a request at prompt_bytes_cap with the role's max_tokens, cache write 5m; x max_revisions 3 x
# episodes): B0 and B1 make no architect call, so the worst case is unchanged: per call haiku
# $0.008, sonnet $0.24, opus $0.80; per part 9 calls each = $9.432; 4 parts, 108 calls = $37.728
# (tests/test_ws14_m2_hard.py::test_worst_case), against the job architect_ladder's $90 cap with
# $0.04 spent. The per-call figures use rates derived from the repo's recorded jzapi figures (jzapi
# is not installed where this was written); `plan --part <experiment>` on the Mac prints jzapi's
# own. No paid call until the owner approves that worst case.
schema: worldsmith.experiment_suite/0.1
suite: m2_hard

common:
  stage: M1                     # ADR 0007: the M1 patch stage (worldsmith.patch/0.1 and 0.2)

  player:
    version: p0.v3
    tier: P0
    driver: "server-scripted Humanoid:MoveTo waypoints via run_script_in_play_mode; never jumps"
    claim: "Substrate probe: the patch changes the real engine outcome. Not an Autopilot or agent result."
    template: runner/templates/p0_controller_v3.luau
    route:
      file: config/p0_route_F1.json
      sha256: b9514a4b5bba46e9c77e7554486515e7de6e26ff0cfe1d77a62e26e1b525b36a
    timing:
      t_attempt: 60       # s, T_attempt (server-side deadline in the controller), as M0
      t_waypoint: 10
      settle: 2
      tick: 0.05
      sample_every: 1     # s, position samples while alive, as in the earlier player
    controller_sha256: cd9a7a0a21ccd32ea7e14990f17b7bba58083f1bfeb2a81e77cf2e122a2d0f8c

  n_attempts: 3           # SPEC section 9: N = 3 per scene version
  pass_k: 3               # 3/3; never lowered. 0 < successes < 3 stops the episode (INCONSISTENT)
  max_revisions: 3        # SPEC sections 6 and 12: proposals per episode, rejects included
  caps:                   # SPEC section 12, enforced per episode (hard stop, not a target)
    attempts_per_episode: 12          # N x (1 + max_revisions)
    architect_calls_per_episode: 3

  origin: [0, 100, 0]
  gap_area_margin_studs: 4
  tool_timeouts_s:
    get_studio_mode: 15
    run_code: 30
    start_stop_play: 30
    run_script_in_play_mode: 90       # > t_attempt, so the controller's deadline fires first

  preflight:                          # ADR 0011: read-only probe before every build (right place, one driver)
    script: runner/templates/preflight_v1.luau
    sha256: 29ffe3d7d717a08910e831054040bcd24098d90a540dc6b7e359627023fdbd6c

  classifier:
    file: config/classifier.yaml
    sha256: cb884ae43587edf41a278520db40c126f184062794dc920cc86d6c7a53454cee

  architect:
    ladder: config/architect_ladder.yaml
    ladder_sha256: 14219e3e779d829427270ad48ac460c14a15aa874e02bc1505f0e717dac2a08a
    job: architect_ladder             # JzLab budgets.yaml, cap $90 (ROADMAP section 9)
    prompt: baseline
    prompt_sha256: df1b7a125269a66a054f74fbccfd22098b61bd79e3549adb1f4aedb14f5f83bd
    prompt_bytes_cap: 32000           # jzapi byte bound of one request; larger requests are refused unsent

  # --dry-run only: hand-written WS-14 M1 replies (architect/fixtures/m1/; replies keyed by request
  # hash, one fixture per part in each list). haiku: the hand fix on revision 1; sonnet: prose, a
  # rejected patch, then the fix; opus: two rejected patches and a code-fenced fix (exhausted).
  # Not a model, not a result (docs/EXPERIMENTS.md).
  dry_run:
    fixtures:
      haiku: [m1/f1a_m1_fix, m1/f1b_m1_fix, m1/f1c_m1_fix, m1/f1d_m1_fix]
      sonnet: [m1/f1a_m1_reject_then_fix, m1/f1b_m1_reject_then_fix, m1/f1c_m1_reject_then_fix,
               m1/f1d_m1_reject_then_fix]
      opus: [m1/f1a_m1_exhausted, m1/f1b_m1_exhausted, m1/f1c_m1_exhausted, m1/f1d_m1_exhausted]

# One part per scene, run in this order; within a part, conditions run in the order listed.
# B2 seeds are declared up front (one per episode); the same seeds in every part.
parts:
  - experiment: m2_hard_f1a
    scene:
      file: scenes/F1-A/scene.json
      canonical_hash: 92f866098bfb850cf4c464179887a862f305c143c8e0b38efdc7978493cddb1d
    conditions:
      - {id: B0, proposer: none, episodes: 1}
      - {id: B1, proposer: hand_fix, episodes: 1, patch: scenes/F1-A/patches/m0_fix.json,
         patch_sha256: 51cd73bc0d86fa7e2ebdf035ef87c3ce57a70e1121c7c29da472050aae884632}
      - {id: B2, proposer: random_valid, episodes: 3, seeds: [0, 1, 2]}
      - {id: B3-haiku, proposer: architect, episodes: 3, role: haiku}
      - {id: B3-sonnet, proposer: architect, episodes: 3, role: sonnet}
      - {id: B3-opus, proposer: architect, episodes: 3, role: opus}

  - experiment: m2_hard_f1b
    scene:
      file: scenes/F1-B/scene.json
      canonical_hash: 2b54bbe734386084383cc192386ed47d72805855034c6704dbc1e0c5d1df1a4b
    conditions:
      - {id: B0, proposer: none, episodes: 1}
      - {id: B1, proposer: hand_fix, episodes: 1, patch: scenes/F1-B/patches/m1_fix.json,
         patch_sha256: 96da1cafbe9ba22489e76e33100859a3573eaba24f1bf448ce9760c28a713ff2}
      - {id: B2, proposer: random_valid, episodes: 3, seeds: [0, 1, 2]}
      - {id: B3-haiku, proposer: architect, episodes: 3, role: haiku}
      - {id: B3-sonnet, proposer: architect, episodes: 3, role: sonnet}
      - {id: B3-opus, proposer: architect, episodes: 3, role: opus}

  - experiment: m2_hard_f1c
    scene:
      file: scenes/F1-C/scene.json
      canonical_hash: e916fde28607c2b5db5db4ed48f05e0c63655131a1b30c2f795ada8b2d38f585
    conditions:
      - {id: B0, proposer: none, episodes: 1}
      - {id: B1, proposer: hand_fix, episodes: 1, patch: scenes/F1-C/patches/m1_fix.json,
         patch_sha256: e1b0f51f809b1ce478c74f45f8a2449d65d2859e8c8f8a3de17f57edc07e5dc9}
      - {id: B2, proposer: random_valid, episodes: 3, seeds: [0, 1, 2]}
      - {id: B3-haiku, proposer: architect, episodes: 3, role: haiku}
      - {id: B3-sonnet, proposer: architect, episodes: 3, role: sonnet}
      - {id: B3-opus, proposer: architect, episodes: 3, role: opus}

  - experiment: m2_hard_f1d
    scene:
      file: scenes/F1-D/scene.json
      canonical_hash: 16d226d197fab76625a767ec82e9aa62d1eebe5b6b97dccbfd96f2ff4bfc0387
    conditions:
      - {id: B0, proposer: none, episodes: 1}
      - {id: B1, proposer: hand_fix, episodes: 1, patch: scenes/F1-D/patches/m1_fix.json,
         patch_sha256: 8599c68ec51e0f81de3120c3af65f68c4b2d7e1c071c99b7cc95a5f811dfd82d}
      - {id: B2, proposer: random_valid, episodes: 3, seeds: [0, 1, 2]}
      - {id: B3-haiku, proposer: architect, episodes: 3, role: haiku}
      - {id: B3-sonnet, proposer: architect, episodes: 3, role: sonnet}
