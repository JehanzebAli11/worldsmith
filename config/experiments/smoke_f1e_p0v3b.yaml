# Re-declaration of smoke_f1e_p0v3 (identical except the id), declared 2026-11-10 BEFORE any run: smoke_f1e_p0v3 stopped at its first preflight (place_marker: ws_place missing after a Studio restart; the marker had not been saved in the place). Nothing else changed.
# Smoke of player p0.v3 on F1-E, the passing control (ADR 0012). Declared and committed on
# 10 Nov 2026 BEFORE any run of it; a change after the first bundle means a NEW experiment id.
# Purpose: show that p0.v3's spawn check (physics steps: warm-up, grounded by FloorMaterial or a
# downward ray, settle) passes repeatedly in the live rig. 2 episodes x 3 attempts = 6 attempts;
# 6/6 SUCCESS expected. Any HARNESS_ERROR (not_warm, not_grounded, moved_before_route) means stop
# and debug; the bar is never lowered. A harness check, not a result. Run it before m2_f1a_b3.
# Before running: places/worldsmith-lab.rbxl open and marked, Studio restarted fresh and in the
# foreground, one Studio driver (docs/EXPERIMENTS.md owner checklist).
# One condition (B0, no patch); no architect call and nothing paid.
