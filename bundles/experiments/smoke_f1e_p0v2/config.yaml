# Smoke of player p0.v2 on F1-E, the passing control (ADR 0011). Replaces smoke_f1e_p0v1, which ran
# in the Autopilot test place while an Autopilot bench run drove Studio (CONTAMINATED; see
# bundles/experiments/smoke_f1e_p0v1/CONTAMINATED.md). Purpose: check p0.v2 and the preflight live
# (3/3 SUCCESS expected on the passing control; spawn check passes; position samples present).
# A harness check, not a result. Before running: places/worldsmith-lab.rbxl open and marked
# (scripts/mark_place.py), no Autopilot or other plugin play session (docs/EXPERIMENTS.md).
# Declared and committed BEFORE any episode; a change after the first bundle means a NEW id.
# One condition (B0, no patch), one episode; no architect call and nothing paid.
schema: worldsmith.experiment/0.1
experiment: smoke_f1e_p0v2
stage: M0                       # patch ops allowed: set bridge_1.length only (ADR 0006)

scene:
  file: scenes/F1-E/scene.json
  canonical_hash: f8a8e654274354e33b340da77235f6b27ea0aa01fcdd55235fd2c98d45df0db3

player:
  version: p0.v2
  tier: P0
  driver: "server-scripted Humanoid:MoveTo waypoints via run_script_in_play_mode; never jumps"
  claim: "Substrate probe: the patch changes the real engine outcome. Not an Autopilot or agent result."
  template: runner/templates/p0_controller_v2.luau
  route:
    file: config/p0_route_F1.json
    sha256: b9514a4b5bba46e9c77e7554486515e7de6e26ff0cfe1d77a62e26e1b525b36a
  timing:
    t_attempt: 60       # s, T_attempt (server-side deadline in the controller), as M0
    t_waypoint: 10
    settle: 2
    tick: 0.05
    sample_every: 1     # s, position samples while alive, as in the earlier player
  controller_sha256: a7472c9cbbea9096f678be02a663ffb503cb2619eb9ea1fe136fcbf2a7858cac

n_attempts: 3           # SPEC section 9: N = 3 per scene version
pass_k: 3               # 3/3; never lowered. 0 < successes < 3 stops the episode (INCONSISTENT)
max_revisions: 3        # SPEC sections 6 and 12: proposals per episode, rejects included
caps:                   # SPEC section 12, enforced per episode (hard stop, not a target)
  attempts_per_episode: 12          # N x (1 + max_revisions)
  architect_calls_per_episode: 3

origin: [0, 100, 0]
gap_area_margin_studs: 4
tool_timeouts_s:
  get_studio_mode: 15
  run_code: 30
  start_stop_play: 30
  run_script_in_play_mode: 90       # > t_attempt, so the controller's deadline fires first

preflight:                          # ADR 0011: read-only probe before every build (right place, one driver)
  script: runner/templates/preflight_v1.luau
  sha256: 29ffe3d7d717a08910e831054040bcd24098d90a540dc6b7e359627023fdbd6c

classifier:
  file: config/classifier.yaml
  sha256: cb884ae43587edf41a278520db40c126f184062794dc920cc86d6c7a53454cee

architect:
  ladder: config/architect_ladder.yaml
  ladder_sha256: 14219e3e779d829427270ad48ac460c14a15aa874e02bc1505f0e717dac2a08a
  job: architect_ladder             # JzLab budgets.yaml, cap $90 (ROADMAP section 9)
  prompt: baseline
  prompt_sha256: df1b7a125269a66a054f74fbccfd22098b61bd79e3549adb1f4aedb14f5f83bd
  prompt_bytes_cap: 24000           # jzapi byte bound of one request; larger requests are refused unsent

# Smoke: one condition, one episode. The architect block above is required by the loader and unused.
