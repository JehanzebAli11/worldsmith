# passing control; position samples present so STUCK is evaluable). A harness check, not a result.
# Declared and committed BEFORE any episode; a change after the first bundle means a NEW id.
# One condition (B0, no patch), one episode; no architect call and nothing paid.
schema: worldsmith.experiment/0.1
experiment: smoke_f1e_p0v1
stage: M0                       # patch ops allowed: set bridge_1.length only (ADR 0006)

