  controller_sha256: dbc1f325ce64bda8b046bc4f08a18050cced76a123b843af5937b85b65754c6d

n_attempts: 3           # SPEC section 9: N = 3 per scene version
pass_k: 3               # 3/3; never lowered. 0 < successes < 3 stops the episode (INCONSISTENT)
max_revisions: 3        # SPEC sections 6 and 12: proposals per episode, rejects included
caps:                   # SPEC section 12, enforced per episode (hard stop, not a target)
  attempts_per_episode: 12          # N x (1 + max_revisions)
  architect_calls_per_episode: 3

origin: [0, 100, 0]
